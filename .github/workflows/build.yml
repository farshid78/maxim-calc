name: Build APK and Deploy Firebase Backend + Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maxim-calc-main
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: maxim-calc
  ANDROID_PACKAGE_NAME: com.maximcalc.app
  ARCHIVE_NAME: maxim-android-project.zip

jobs:
  build:
    name: Test and Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ARCHIVE_NAME" ]; then
            echo "::error::Missing $ARCHIVE_NAME in repository root."
            exit 1
          fi
          mkdir -p project
          unzip -q -o "$ARCHIVE_NAME" -d project
          SETTINGS_FILE="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file was not found in the ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Android app directory not found: $PROJECT_DIR/app"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Find and validate Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$PROJECT_DIR/app/google-services.json"
          mkdir -p "$(dirname "$TARGET")"
          if [ ! -s "$TARGET" ]; then
            SOURCE="$(find . -type f -name google-services.json -not -path './.git/*' -not -path "$TARGET" -print -quit || true)"
            if [ -n "$SOURCE" ]; then
              cp "$SOURCE" "$TARGET"
            else
              INNER="$(unzip -Z1 "$ARCHIVE_NAME" | grep -E '(^|/)google-services\.json$' | head -n 1 || true)"
              if [ -z "$INNER" ]; then
                echo "::error::google-services.json was not found."
                exit 1
              fi
              unzip -p "$ARCHIVE_NAME" "$INNER" > "$TARGET"
            fi
          fi
          python3 -m json.tool "$TARGET" >/dev/null
          python3 - "$TARGET" "$FIREBASE_PROJECT_ID" "$ANDROID_PACKAGE_NAME" <<'PYTHON'
          import json, sys
          path, expected_project, expected_package = sys.argv[1:]
          with open(path, encoding="utf-8") as f:
              config = json.load(f)
          actual_project = config.get("project_info", {}).get("project_id")
          if actual_project != expected_project:
              raise SystemExit(f"Expected Firebase project '{expected_project}', but google-services.json contains '{actual_project}'.")
          packages = [c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in config.get("client", [])]
          if expected_package not in packages:
              raise SystemExit(f"Package '{expected_package}' was not found in google-services.json.")
          print("Firebase Android config validated successfully.")
          PYTHON

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" testDebugUnitTest --no-daemon
          else
            gradle -p "$PROJECT_DIR" testDebugUnitTest --no-daemon
          fi

      - name: Build Debug and Release APKs
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" assembleDebug assembleRelease --no-daemon
          else
            gradle -p "$PROJECT_DIR" assembleDebug assembleRelease --no-daemon
          fi
          DEBUG_APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          [ -s "$DEBUG_APK" ] || { echo "::error::Debug APK was not generated."; exit 1; }
          [ -s "$RELEASE_APK" ] || { echo "::error::Release APK was not generated."; exit 1; }
          ls -lh "$DEBUG_APK" "$RELEASE_APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: maxim-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: maxim-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" maxim.apk
          TAG="v${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" maxim.apk --clobber
          else
            gh release create "$TAG" maxim.apk --title "Maxim APK ${GITHUB_RUN_NUMBER}" --notes "Maxim Android APK built by GitHub Actions."
          fi

  deploy-firebase:
    name: Deploy Firebase Cloud Functions, Firestore Rules and Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract and validate Firebase project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ARCHIVE_NAME" ]; then
            echo "::error::Missing $ARCHIVE_NAME in repository root."
            exit 1
          fi
          mkdir -p project
          unzip -q -o "$ARCHIVE_NAME" -d project
          FIREBASE_CONFIG="$(find project -type f -name firebase.json -print -quit)"
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::error::firebase.json was not found in the ZIP."
            exit 1
          fi
          FIREBASE_DIR="$(dirname "$FIREBASE_CONFIG")"
          FIREBASERC="$FIREBASE_DIR/.firebaserc"
          FUNCTIONS_DIR="$FIREBASE_DIR/functions"
          [ -s "$FIREBASERC" ] || { echo "::error::.firebaserc was not found beside firebase.json."; exit 1; }
          [ -s "$FUNCTIONS_DIR/package.json" ] || { echo "::error::functions/package.json is missing."; exit 1; }
          [ -s "$FUNCTIONS_DIR/index.js" ] || { echo "::error::functions/index.js is missing."; exit 1; }
          [ -s "$FIREBASE_DIR/firestore.rules" ] || { echo "::error::firestore.rules is missing."; exit 1; }
          python3 - "$FIREBASE_CONFIG" "$FIREBASERC" "$FIREBASE_DIR" "$FIREBASE_PROJECT_ID" <<'PYTHON'
          import json, os, sys
          config_path, rc_path, base_dir, expected_project = sys.argv[1:]
          with open(config_path, encoding="utf-8") as f: config = json.load(f)
          with open(rc_path, encoding="utf-8") as f: rc = json.load(f)
          default_project = rc.get("projects", {}).get("default")
          if default_project != expected_project:
              raise SystemExit(f".firebaserc default project is '{default_project}', expected '{expected_project}'.")
          functions = config.get("functions")
          if not isinstance(functions, dict) or not functions.get("source"):
              raise SystemExit("firebase.json must define functions.source.")
          functions_path = os.path.abspath(os.path.join(base_dir, functions["source"]))
          if not os.path.isdir(functions_path):
              raise SystemExit(f"Functions source directory missing: {functions_path}")
          hosting = config.get("hosting")
          entries = [hosting] if isinstance(hosting, dict) else hosting if isinstance(hosting, list) else []
          if not entries: raise SystemExit("firebase.json has no valid Hosting configuration.")
          for entry in entries:
              public_dir = entry.get("public") if isinstance(entry, dict) else None
              if not public_dir: raise SystemExit("Each Hosting configuration must define 'public'.")
              full_path = os.path.abspath(os.path.join(base_dir, public_dir))
              index_file = os.path.join(full_path, "index.html")
              if not os.path.isdir(full_path): raise SystemExit(f"Hosting public directory missing: {full_path}")
              if not os.path.isfile(index_file) or os.path.getsize(index_file) == 0:
                  raise SystemExit(f"Hosting index.html missing or empty: {index_file}")
          print(f"Firebase configuration validated for {expected_project}.")
          PYTHON
          echo "FIREBASE_DIR=$FIREBASE_DIR" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Authenticate to Google Cloud / Firebase
        uses: google-github-actions/auth@v3
        with:
          project_id: maxim-calc
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAXIM_CALC }}
          export_environment_variables: true
          create_credentials_file: true

      - name: Install Firebase CLI and Functions dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools
          cd "$FIREBASE_DIR/functions"
          npm install --omit=dev

      - name: Verify required quota functions exist in source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'getQuotaStatus' "$FIREBASE_DIR/functions/index.js" || { echo "::error::getQuotaStatus is missing from functions/index.js"; exit 1; }
          grep -q 'consumeFreeCalculation' "$FIREBASE_DIR/functions/index.js" || { echo "::error::consumeFreeCalculation is missing from functions/index.js"; exit 1; }
          firebase --version

      - name: Deploy Firebase backend and Hosting
        shell: bash
        run: |
          set -euo pipefail
          cd "$FIREBASE_DIR"
          echo "Deploying Cloud Functions, Firestore Rules and Hosting to $FIREBASE_PROJECT_ID..."
          firebase deploy \
            --only functions,firestore:rules,hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
          echo "Firebase backend and Hosting deploy completed successfully."
