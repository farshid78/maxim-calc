name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q maxim-android-project.zip -d project
      - name: Check Firebase config exists
        run: test -f project/app/google-services.json || (echo "google-services.json is missing" && exit 1)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        working-directory: project
        run: gradle testDebugUnitTest --no-daemon
      - name: Build debug and release APKs
        working-directory: project
        run: gradle assembleDebug assembleRelease --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maxim-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: maxim-release-apk
          path: project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp project/app/build/outputs/apk/release/app-release.apk maxim.apk
          gh release create "v${{ github.run_number }}" maxim.apk --title "Maxim APK ${{ github.run_number }}" --notes "Maxim calculator release APK"
