
name: Build APK and Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project and find Gradle root
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="maxim-android-project.zip"
          if [ ! -s "$ARCHIVE" ]; then
            echo "ERROR: $ARCHIVE was not found in the repository root."
            exit 1
          fi

          mkdir -p project
          unzip -q -o "$ARCHIVE" -d project

          echo "=== Searching for Gradle project ==="
          find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print

          SETTINGS="$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found in the ZIP."
            find project -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Gradle project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Find and validate Firebase Android config
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$PROJECT_DIR/app/google-services.json"
          mkdir -p "$(dirname "$TARGET")"

          if [ ! -s "$TARGET" ]; then
            SOURCE="$(find . -type f -name 'google-services.json' \
              -not -path './.git/*' \
              -not -path "$TARGET" \
              -print -quit || true)"

            if [ -n "$SOURCE" ]; then
              echo "Found Firebase config: $SOURCE"
              cp "$SOURCE" "$TARGET"
            else
              ARCHIVE="maxim-android-project.zip"
              INNER="$(unzip -Z1 "$ARCHIVE" | grep -E '(^|/)google-services\.json$' | head -n 1 || true)"
              if [ -n "$INNER" ]; then
                echo "Extracting Firebase config from ZIP"
                unzip -p "$ARCHIVE" "$INNER" > "$TARGET"
              else
                echo "ERROR: google-services.json was not found."
                exit 1
              fi
            fi
          fi

          python3 -m json.tool "$TARGET" >/dev/null
          python3 - "$TARGET" <<'PYTHON'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              config = json.load(f)

          assert config.get("project_info", {}).get("project_id") == "maxim-calc", \
              "Firebase project_id does not match maxim-calc"

          packages = [
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in config.get("client", [])
          ]
          assert "com.maximcalc.app" in packages, \
              "Package com.maximcalc.app not found in Firebase config"

          print("Firebase Android JSON validated successfully.")
          PYTHON

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" testDebugUnitTest --no-daemon

      - name: Build debug and release APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" assembleDebug assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maxim-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: maxim-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" maxim.apk
          TAG="v${GITHUB_RUN_NUMBER}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" maxim.apk --clobber
          else
            gh release create "$TAG" maxim.apk \
              --title "Maxim APK ${GITHUB_RUN_NUMBER}" \
              --notes "Maxim calculator release APK. Build and tests completed in GitHub Actions."
          fi

  deploy-hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project and find Firebase Hosting config
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="maxim-android-project.zip"
          if [ ! -s "$ARCHIVE" ]; then
            echo "ERROR: $ARCHIVE was not found in the repository root."
            exit 1
          fi

          mkdir -p project
          unzip -q -o "$ARCHIVE" -d project

          FIREBASE_CONFIG="$(find project -type f -name firebase.json -print -quit)"
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "ERROR: firebase.json was not found in the extracted project."
            exit 1
          fi

          FIREBASE_DIR="$(dirname "$FIREBASE_CONFIG")"
          if [ ! -d "$FIREBASE_DIR/hosting" ]; then
            echo "ERROR: Hosting folder not found: $FIREBASE_DIR/hosting"
            exit 1
          fi
          if [ ! -s "$FIREBASE_DIR/.firebaserc" ]; then
            echo "ERROR: .firebaserc not found next to firebase.json."
            exit 1
          fi

          echo "FIREBASE_DIR=$FIREBASE_DIR" >> "$GITHUB_ENV"
          echo "Firebase Hosting directory: $FIREBASE_DIR"

      - name: Setup Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          project_id: maxim-calc
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAXIM_CALC }}'

      - name: Install Firebase CLI
        shell: bash
        run: npm install --global firebase-tools

      - name: Deploy Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          cd "$FIREBASE_DIR"
          firebase use maxim-calc
          firebase deploy --only hosting --project maxim-calc --non-interactive
