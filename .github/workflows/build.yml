name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project and find Gradle root
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p project
          unzip -q -o maxim-android-project.zip -d project

          echo "=== Searching for Gradle project ==="
          find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print

          SETTINGS="$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found in the ZIP."
            find project -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Gradle project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Find and validate Firebase config
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$PROJECT_DIR/app/google-services.json"
          mkdir -p "$(dirname "$TARGET")"

          if [ ! -s "$TARGET" ]; then
            SOURCE="$(find . -type f -name 'google-services.json' \
              -not -path './.git/*' \
              -not -path "$TARGET" \
              -print -quit || true)"

            if [ -n "$SOURCE" ]; then
              echo "Found Firebase config: $SOURCE"
              cp "$SOURCE" "$TARGET"
            else
              ARCHIVE="maxim-android-project.zip"

              if [ -f "$ARCHIVE" ]; then
                INNER="$(unzip -Z1 "$ARCHIVE" \
                  | grep -E '(^|/)google-services\.json$' \
                  | head -n 1 || true)"

                if [ -n "$INNER" ]; then
                  echo "Extracting Firebase config from ZIP"
                  unzip -p "$ARCHIVE" "$INNER" > "$TARGET"
                else
                  echo "ERROR: JSON not found inside ZIP."
                  exit 1
                fi
              else
                echo "ERROR: JSON and project ZIP not found."
                exit 1
              fi
            fi
          fi

          python3 -m json.tool "$TARGET" >/dev/null

          python3 - "$TARGET" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              config = json.load(f)

          assert config.get("project_info", {}).get("project_id") == "maxim-calc", \
              "Firebase project_id does not match maxim-calc"

          clients = config.get("client", [])
          packages = [
              item.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              for item in clients
          ]

          assert "com.maximcalc.app" in packages, \
              "Package com.maximcalc.app not found in Firebase config"

          print("Firebase JSON validated successfully.")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" testDebugUnitTest --no-daemon

      - name: Build debug and release APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" assembleDebug assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maxim-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: maxim-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" maxim.apk

          gh release create "v${{ github.run_number }}" maxim.apk \
            --title "Maxim APK ${{ github.run_number }}" \
            --notes "Maxim calculator release APK"
