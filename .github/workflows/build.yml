name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q maxim-android-project.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        working-directory: project
        run: gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx2g
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk maxim.apk
          gh release create "v${{ github.run_number }}" maxim.apk --title "Maxim APK ${{ github.run_number }}" --notes "Maxim calculator APK"
